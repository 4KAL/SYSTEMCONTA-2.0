[package]
name = "sistema-contabilidad"
version = "0.1.0"
edition = "2024"
default-run = "sistema-contabilidad"
description = "Sistema de Contabilidad Desktop - Aplicación nativa en Rust"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "canvas"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tower = "0.5"
printpdf = "0.7"
rand = "0.8"
qrcode = "0.14"
